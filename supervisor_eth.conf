[unix_http_server]
file=/var/run/supervisor/supervisor.sock   ; the path to the socket file

[supervisord]
logfile=/var/log/supervisord.log ; main log file; default $CWD/supervisord.log
logfile_maxbytes=50MB        ; max main logfile bytes b4 rotation; default 50MB
logfile_backups=10           ; # of main logfile backups; 0 means none, default 10
loglevel=info                ; log level; default info; others: debug,warn,trace
pidfile=/var/run/supervisor/supervisord.pid ; supervisord pidfile; default supervisord.pid
nodaemon=false               ; start in foreground if true; default false
silent=false                 ; no logs to stdout if true; default false
minfds=1024                  ; min. avail startup file descriptors; default 1024
minprocs=200                 ; min. avail process descriptors;default 200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock ; use a unix:// URL  for a unix socket

[program:geth]
command=/usr/local/sbin/geth --authrpc.addr localhost --authrpc.port 8551 --authrpc.vhosts localhost --authrpc.jwtsecret SECRET_PATH --maxpeers 15
user=ethereum
environment=HOME="/home/ethereum"
redirect_stderr=true          ; redirect proc stderr to stdout (default false)
stdout_logfile=/home/ethereum/logs/geth/geth.log        ; stdout log path, NONE for none; default AUTO
stdout_logfile_maxbytes=100MB   ; max # logfile bytes b4 rotation (default 50MB)

[program:lighthouse]
command=/usr/local/sbin/lighthouse bn --network mainnet --execution-endpoint http://127.0.0.1:8551 --execution-jwt SECRET_PATH --checkpoint-sync-url https://mainnet.checkpoint.sigp.io --http --gui --target-peers 20
user=ethereum
environment=HOME="/home/ethereum"
; autostart=false
